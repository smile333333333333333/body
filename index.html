
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodyguard: Last Limbs</title>
<style>
body{margin:0;background:#111820;color:white;font-family:Arial;text-align:center}
h2{margin:12px}
canvas{width:96%;max-width:800px;background:#283039;border:2px solid #82909a;touch-action:none}
button{background:#354754;color:white;border:1px solid #91a5b0;border-radius:8px;padding:13px;margin:4px;font-weight:bold}
#msg{min-height:38px;color:#ffdc91;padding:8px}
</style>
</head>
<body>
<h2>BODYGUARD: LAST LIMBS</h2>
<div id="stats">Loading...</div>
<canvas id="c" width="800" height="460"></canvas>
<div id="msg">Protect the body! Enemies attack it, not you.</div>
<div>
<button onpointerdown="keys.l=true" onpointerup="keys.l=false" onpointerleave="keys.l=false">◀ LEFT</button>
<button onclick="dodge()">DODGE ▲</button>
<button onpointerdown="keys.r=true" onpointerup="keys.r=false" onpointerleave="keys.r=false">RIGHT ▶</button>
</div>
<div>
<button onclick="attack()">ATTACK</button>
<button onclick="guard()">GUARD BODY</button>
<button onclick="heal()">HEAL +15</button>
<button onclick="reset()">RESTART</button>
</div>
<script>
const c=document.querySelector("#c"),x=c.getContext("2d");
const msg=document.querySelector("#msg"),stats=document.querySelector("#stats");
let keys={l:false,r:false},p,b,enemies,boss,stage,guardTime,ended,limbs;
function reset(){
p={x:125,y:355,hp:100,max:100};
b={x:400,y:270,hp:100,max:100};
stage=1;guardTime=0;ended=false;boss=null;
limbs={arm:true,leg:true,eye:true};
keys={l:false,r:false};wave();say("Protect the body. Clear the waves and defeat the boss.");
}
function say(t){msg.textContent=t}
function wave(){
enemies=[];
boss=null;
if(stage<4){
for(let i=0;i<stage+2;i++)
enemies.push({x:570+(i%2)*100,y:90+Math.floor(i/2)*75,
hp:stage===1?30:stage===2?38:45,max:stage===1?30:stage===2?38:45,
r:19,cd:50+Math.random()*40,s:0.45+stage*.1});
}else{
boss={x:650,y:140,hp:160,max:160,r:48,cd:55};
say("BOSS FIGHT! Protect the body!");
}
}
function attack(){
if(ended)return;
let list=enemies.slice();if(boss)list.push(boss);
list.sort((a,z)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(z.x-p.x,z.y-p.y));
let e=list[0];
if(!e){say("No enemies left!");return}
if(Math.hypot(e.x-p.x,e.y-p.y)>330){say("Move closer to attack!");return}
e.hp-=limbs.arm?16:7;
say("You hit the enemy for "+(limbs.arm?16:7)+" damage!");
if(e.hp<=0){
if(e===boss)boss=null;
else enemies=enemies.filter(q=>q.hp>0);
check();
}
}
function guard(){
if(ended)return;
guardTime=130;say("GUARD ACTIVE! Body damage reduced.");
}
function heal(){
if(!ended){p.hp=Math.min(100,p.hp+15);say("Recovered 15 health.");}
}
function dodge(){
if(!ended){p.x=Math.max(25,Math.min(775,p.x+(p.x<400?55:-55)));p.y=355;}
}
function hurtBody(n){
b.hp=Math.max(0,b.hp-(guardTime>0?Math.ceil(n*.35):n));
if(b.hp<=0){ended=true;say("THE BODY WAS LOST! Restart to try again.");}
}
function check(){
if(enemies.length===0&&!boss){
if(stage<4){stage++;wave();say("Wave cleared! Stage "+stage+" begins.");}
else{ended=true;say("VICTORY! You protected the body!");}
}
}
function bar(px,py,w,h,hp,max,color){
x.fillStyle="#15191d";x.fillRect(px,py,w,h);
x.fillStyle=color;x.fillRect(px,py,w*Math.max(0,hp/max),h);
}
function enemyDraw(e,isBoss){
x.save();x.translate(e.x,e.y);
x.fillStyle=isBoss?"#922b76":"#b64e49";
x.strokeStyle=isBoss?"#ff8ce1":"#efaaa0";x.lineWidth=3;
x.beginPath();x.ellipse(0,0,e.r,e.r*.82,0,0,7);x.fill();x.stroke();
// Spikes
for(let i=0;i<7;i++){
let a=i*Math.PI*2/7;
x.beginPath();x.moveTo(Math.cos(a)*e.r*.65,Math.sin(a)*e.r*.65);
x.lineTo(Math.cos(a)*(e.r+12),Math.sin(a)*(e.r+12));x.stroke();
}
x.fillStyle="white";
x.beginPath();x.arc(-e.r*.3,-5,5,0,7);x.arc(e.r*.3,-5,5,0,7);x.fill();
x.fillStyle="#171217";
x.beginPath();x.arc(-e.r*.3,-5,2,0,7);x.arc(e.r*.3,-5,2,0,7);x.fill();
x.restore();
bar(e.x-e.r,e.y-e.r-13,e.r*2,6,e.hp,e.max,isBoss?"#f57de1":"#ff766b");
x.fillStyle="white";x.textAlign="center";
x.font="bold 12px Arial";x.fillText(isBoss?"BOSS":"ENEMY",e.x,e.y-e.r-18);
x.textAlign="left";
}
function draw(){
x.clearRect(0,0,800,460);
x.fillStyle="#283039";x.fillRect(0,0,800,460);
x.strokeStyle="#323d46";
for(let i=0;i<800;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,460);x.stroke()}
for(let i=0;i<460;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(800,i);x.stroke()}
// Protected body: large and clearly visible
x.fillStyle="#d6c6a6";x.strokeStyle="#fff0ce";x.lineWidth=4;
x.beginPath();x.ellipse(b.x,b.y,48,58,0,0,7);x.fill();x.stroke();
// Body face
x.fillStyle="#172027";
x.beginPath();x.ellipse(b.x-15,b.y-9,6,9,0,0,7);
x.ellipse(b.x+15,b.y-9,6,9,0,0,7);x.fill();
x.strokeStyle="#172027";x.lineWidth=4;
x.beginPath();x.arc(b.x,b.y+8,15,.2,Math.PI-.2);x.stroke();
// Body limbs and missing-limb appearance
x.lineWidth=12;x.lineCap="round";
x.strokeStyle=limbs.arm?"#d6c6a6":"#593333";
x.beginPath();x.moveTo(b.x-30,b.y+12);x.lineTo(b.x-57,b.y+31);
x.moveTo(b.x+30,b.y+12);x.lineTo(b.x+57,b.y+31);x.stroke();
x.strokeStyle=limbs.leg?"#d6c6a6":"#593333";
x.beginPath();x.moveTo(b.x-15,b.y+43);x.lineTo(b.x-23,b.y+60);
x.moveTo(b.x+15,b.y+43);x.lineTo(b.x+23,b.y+60);x.stroke();
x.fillStyle="white";x.textAlign="center";x.font="bold 14px Arial";
x.fillText("BODY TO PROTECT",b.x,b.y-72);
bar(b.x-65,b.y-63,130,9,b.hp,b.max,"#74dc99");
// Player character: bright orange, clearly visible
x.fillStyle="#f0a34b";x.strokeStyle="#fff0cf";x.lineWidth=3;
x.beginPath();x.arc(p.x,p.y,18,0,7);x.fill();x.stroke();
x.fillStyle="#352521";x.beginPath();x.arc(p.x,p.y-6,11,Math.PI,2*Math.PI);x.fill();
x.fillStyle="#15191d";x.beginPath();x.arc(p.x-5,p.y,2,0,7);x.arc(p.x+5,p.y,2,0,7);x.fill();
x.strokeStyle="#f0a34b";x.lineWidth=5;
x.beginPath();x.moveTo(p.x-9,p.y+13);x.lineTo(p.x-14,p.y+24);
x.moveTo(p.x+9,p.y+13);x.lineTo(p.x+14,p.y+24);x.stroke();
if(guardTime>0){x.strokeStyle="#75dfff";x.lineWidth=4;x.beginPath();x.arc(p.x,p.y,28,0,7);x.stroke()}
x.fillStyle="white";x.font="bold 13px Arial";x.fillText("YOU",p.x,p.y-28);
bar(p.x-25,p.y+29,50,6,p.hp,100,"#f0a34b");
enemies.forEach(e=>enemyDraw(e,false));
if(boss)enemyDraw(boss,true);
if(ended){
x.fillStyle="rgba(0,0,0,.65)";x.fillRect(180,175,440,85);
x.fillStyle="white";x.font="bold 28px Arial";x.textAlign="center";
x.fillText(b.hp>0?"RUN ENDED":"BODY LOST",400,215);
x.font="15px Arial";x.fillText("Press RESTART to play again",400,243);x.textAlign="left";
}
stats.textContent=`Stage ${stage}/4 | Body: ${b.hp} HP | You: ${p.hp} HP | Arm: ${limbs.arm?"OK":"LOST"} | Leg: ${limbs.leg?"OK":"LOST"} | Eye: ${limbs.eye?"OK":"LOST"}`;
}
function update(){
if(!ended){
if(keys.l)p.x=Math.max(20,p.x-(limbs.leg?4:2.5));
if(keys.r)p.x=Math.min(780,p.x+(limbs.leg?4:2.5));
if(guardTime>0)guardTime--;
enemies.forEach(e=>{
let dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy)||1;
if(d>b.r+e.r)e.x+=dx/d*e.s,e.y+=dy/d*e.s;
else if(e.cd--<=0){hurtBody(4+stage);e.cd=65;}
});
if(boss){
let dx=b.x-boss.x,dy=b.y-boss.y,d=Math.hypot(dx,dy)||1;
if(d>b.r+boss.r)boss.x+=dx/d*.5,boss.y+=dy/d*.5;
else if(boss.cd--<=0){hurtBody(12);boss.cd=55;}
}
}
draw();requestAnimationFrame(update);
}
window.addEventListener("keydown",e=>{
if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.l=true;
if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.r=true;
if(e.key===" "){e.preventDefault();guard()}
if(e.key==="Enter")attack();
if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")dodge();
});
window.addEventListener("keyup",e=>{
if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.l=false;
if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.r=false;
});
reset();update();
</script>
</body>
</html>
